name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    # Fast tier: pure-Python tests that don't need the model or Postgres.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps (dev minus torch)
        run: |
          pip install pytest==8.3.4 pytest-asyncio==0.25.0 httpx==0.28.1 \
                      asgi-lifespan==2.1.0 fastapi==0.115.5 jinja2==3.1.4 \
                      python-multipart==0.0.18 sse-starlette==2.1.3 \
                      anthropic==0.39.0 python-dotenv==1.0.1 \
                      markdown2==2.5.4 numpy==2.1.3
      - name: Run unit tests (skip DB + model tests)
        run: pytest -v tests/test_rag.py tests/test_embeddings.py

  integration:
    # Full tier: spin up Postgres with pgvector, install the full stack,
    # run the DB + model-dependent tests.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: outdoors_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/outdoors_test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/outdoors_test
      RUN_MODEL_TESTS: "1"
      ANTHROPIC_API_KEY: test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache HuggingFace model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-roberta-base-nli-stsb-mean-tokens-v1
      - name: Install CPU torch + deps
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          pip install -r requirements-dev.txt
      - name: Run full test suite
        run: pytest -v
