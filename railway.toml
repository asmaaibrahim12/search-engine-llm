[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# startCommand intentionally omitted — the Dockerfile CMD uses `sh -c` to
# expand $PORT correctly. Overriding startCommand here runs the command in
# exec form without a shell, which leaves ${PORT} unexpanded and uvicorn 400s.
healthcheckPath = "/healthz"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Link a Postgres service in the Railway dashboard; it will inject DATABASE_URL.
# Set ANTHROPIC_API_KEY manually in the Railway dashboard — never commit it.
