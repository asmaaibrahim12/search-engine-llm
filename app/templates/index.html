<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1F1E1B" media="(prefers-color-scheme: dark)" />
    <title>Outdoors semantic search</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js"></script>

    <style>
      :root {
        --bg: #F4F1EA;
        --surface: #FFFFFF;
        --surface-alt: #FAF7F0;
        --ink: #1A1A19;
        --ink-muted: #6B6862;
        --border: #E3DED2;
        --accent: #7FAE63;
        --accent-soft: #DCE8CD;
        --accent-ink: #3B5920;
        --success: #3B5920;
        --warn: #C89A3A;
        --radius: 12px;
        --radius-sm: 8px;
        --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      [data-theme="dark"] {
        --bg: #1F1E1B;
        --surface: #2A2926;
        --surface-alt: #26251F;
        --ink: #F4F1EA;
        --ink-muted: #A39F97;
        --border: #3B3A36;
        --accent-soft: #2F4A1F;
        --accent-ink: #DCE8CD;
      }

      * { box-sizing: border-box; }

      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      html, body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
        font-size: 15px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        overflow-wrap: break-word;
      }

      .container {
        max-width: 1120px;
        margin: 0 auto;
        /* Fluid vertical padding; horizontal uses env() for notch safety. */
        padding:
          clamp(24px, 5vw, 56px)
          max(16px, env(safe-area-inset-right))
          clamp(48px, 10vw, 96px)
          max(16px, env(safe-area-inset-left));
      }

      .header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      .header > div:first-child {
        /* Let the title take remaining space and wrap cleanly. */
        min-width: 0;
        flex: 1 1 280px;
      }

      h1 {
        font-family: Fraunces, Georgia, serif;
        font-weight: 500;
        font-size: clamp(1.75rem, 1.2rem + 2.5vw, 2.5rem);
        line-height: 1.1;
        letter-spacing: -0.01em;
        margin: 0 0 6px;
      }
      h1 em {
        font-style: italic;
        color: var(--accent);
        font-weight: 500;
      }

      h2 {
        font-family: Fraunces, Georgia, serif;
        font-weight: 500;
        font-size: clamp(1.05rem, 0.95rem + 0.5vw, 1.25rem);
        margin: 0 0 16px;
      }

      .subtitle {
        color: var(--ink-muted);
        margin: 0 0 clamp(24px, 4vw, 40px);
        font-size: clamp(0.9rem, 0.85rem + 0.3vw, 1rem);
        max-width: 620px;
      }

      /* Theme toggle */
      .theme-toggle {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--ink-muted);
        border-radius: 999px;
        padding: 6px 14px;
        font-size: 13px;
        min-height: 32px;
        cursor: pointer;
        font-family: inherit;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        flex-shrink: 0;
      }
      .theme-toggle:hover { color: var(--ink); }

      /* Search form */
      .search-form { margin-bottom: 24px; }
      .search {
        display: flex;
        gap: 6px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 6px;
        transition: border-color 200ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      .search:focus-within { border-color: var(--accent); }

      /* Filters */
      .filters {
        margin-top: 10px;
        padding: 0 4px;
      }
      .filters > summary {
        cursor: pointer;
        color: var(--ink-muted);
        font-size: 13px;
        padding: 6px 4px;
        list-style: none;
        -webkit-tap-highlight-color: transparent;
      }
      .filters > summary::-webkit-details-marker { display: none; }
      .filters > summary::before {
        content: "▸ ";
        display: inline-block;
        transition: transform 150ms;
        margin-right: 2px;
      }
      .filters[open] > summary::before { transform: rotate(90deg); }
      .filters[open] > summary { color: var(--ink); }
      .filter-group {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding: 8px 4px;
      }
      .filter-label {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--ink-muted);
        margin-right: 4px;
      }
      .toggle, .tag-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--surface);
        font-size: 13px;
        cursor: pointer;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      .toggle input, .tag-pill input {
        /* Hide native control; the pill's visual state tells the story. */
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      .toggle:has(input:checked),
      .tag-pill:has(input:checked) {
        background: var(--accent-soft);
        color: var(--accent-ink);
        border-color: transparent;
      }

      /* Applied-filter chips shown above the results */
      .applied-filters {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 0 0 16px 0;
      }
      .applied-filter {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px 10px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent-ink);
        font-size: 12px;
        font-weight: 500;
      }

      input[type="search"] {
        flex: 1;
        min-width: 0;              /* allow shrinking below content width */
        border: 0;
        background: transparent;
        padding: 12px 14px;
        font-size: 16px;           /* 16px prevents iOS zoom on focus */
        font-family: inherit;
        color: var(--ink);
        outline: none;
      }
      input[type="search"]::placeholder { color: var(--ink-muted); }
      /* Hide the WebKit X clear button — we don't need it and it eats space */
      input[type="search"]::-webkit-search-cancel-button { appearance: none; }

      button {
        padding: 10px 22px;
        min-height: 44px;          /* iOS/Android recommended touch target */
        border: 0;
        border-radius: var(--radius-sm);
        background: var(--accent);
        color: #fff;
        font-family: inherit;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        transition: background 200ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      button:hover { background: #6A9552; }
      button:active { background: #587F3D; }

      /* Two-column layout — collapses to single column below 900px */
      .grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 24px;
        margin-top: 24px;
      }
      @media (max-width: 900px) {
        .grid {
          grid-template-columns: 1fr;
          gap: 16px;
        }
        .trace { position: static !important; }
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: clamp(16px, 3vw, 28px);
      }
      .card + .card { margin-top: 16px; }
      .card.alt { background: var(--surface-alt); }

      /* Summary pane */
      .summary {
        font-size: clamp(0.95rem, 0.9rem + 0.3vw, 1rem);
        color: var(--ink);
        min-height: 3rem;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .summary:empty::before {
        content: "Summary will stream here as Claude responds…";
        color: var(--ink-muted);
        font-style: italic;
      }

      /* Results list */
      ol.results { list-style: none; padding: 0; margin: 0; }
      ol.results li {
        padding: 16px 0;
        border-top: 1px solid var(--border);
        cursor: pointer;
        position: relative;
      }
      ol.results li:first-child { border-top: 0; padding-top: 0; }
      ol.results li:hover { background: var(--surface-alt); }

      /* Thumbs */
      .thumbs {
        margin-top: 8px;
        display: flex;
        gap: 4px;
      }
      .thumb {
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 3px 10px;
        min-height: 28px;
        font-size: 14px;
        color: var(--ink-muted);
        cursor: pointer;
        line-height: 1;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      .thumb:hover { background: var(--surface-alt); color: var(--ink); }
      .thumb.voted-up   { background: var(--accent-soft); color: var(--accent-ink); border-color: transparent; }
      .thumb.voted-down { background: var(--border); color: var(--ink); border-color: transparent; }
      ol.results .title-row {
        display: flex;
        align-items: baseline;
        gap: 10px;
        flex-wrap: wrap;
      }
      ol.results .title {
        font-weight: 500;
        font-size: clamp(0.95rem, 0.9rem + 0.2vw, 1rem);
        color: var(--ink);
        overflow-wrap: anywhere;
      }
      ol.results .body {
        color: var(--ink-muted);
        font-size: 14px;
        margin-top: 4px;
        overflow-wrap: anywhere;
      }
      .chip {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent-ink);
        font-size: 12px;
        font-family: var(--mono);
        font-weight: 500;
        flex-shrink: 0;
      }
      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 500;
        flex-shrink: 0;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--ink-muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .badge-accepted {
        background: var(--accent-soft);
        color: var(--accent-ink);
        border-color: transparent;
      }
      .badge-answer {
        background: var(--surface);
        color: var(--ink);
        border-color: var(--border);
      }
      .badge-question {
        background: transparent;
        color: var(--ink-muted);
      }
      .badge-muted {
        background: transparent;
        color: var(--ink-muted);
        text-transform: none;
        font-family: var(--mono);
      }

      /* Behind-the-scenes trace panel */
      .trace { position: sticky; top: 24px; align-self: flex-start; min-width: 0; }
      .trace-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-weight: 500;
        color: var(--ink-muted);
        margin: 0 0 18px;
      }
      .trace-title .tick {
        width: 6px; height: 6px; border-radius: 50%;
        background: var(--accent);
      }

      .stage {
        display: flex;
        gap: 12px;
        padding: 14px 0;
        border-top: 1px solid var(--border);
      }
      .stage:first-child { border-top: 0; padding-top: 2px; }
      .stage .dot {
        flex: 0 0 8px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-top: 7px;
        background: var(--border);
        transition: background 200ms;
      }
      .stage[data-status="active"] .dot {
        background: var(--accent);
        animation: pulse 1.2s ease-in-out infinite;
      }
      .stage[data-status="done"] .dot { background: var(--success); }
      .stage .body {
        min-width: 0;
        flex: 1 1 0;
      }
      .stage .label {
        font-weight: 500;
        font-size: 14px;
        color: var(--ink);
        overflow-wrap: anywhere;
      }
      .stage .meta {
        display: block;
        color: var(--ink-muted);
        font-size: 12px;
        font-family: var(--mono);
        margin-top: 3px;
        overflow-wrap: anywhere;
      }
      .stage .meta + .meta { margin-top: 2px; }
      .stage .sparkline {
        display: flex;
        gap: 1px;
        margin-top: 8px;
        height: 18px;
        align-items: center;
        max-width: 100%;
        overflow: hidden;
      }
      .stage .sparkline span {
        display: block;
        width: 3px;
        background: var(--accent-soft);
        border-radius: 1px;
        flex-shrink: 0;
      }
      .stage .hitbars { margin-top: 8px; }
      .stage .hitbar {
        display: block;
        height: 3px;
        border-radius: 2px;
        background: var(--accent-soft);
        margin: 3px 0;
        max-width: 100%;
      }
      .stage .hitbar.top { background: var(--accent); }

      @keyframes pulse {
        0%, 100% { opacity: 0.45; transform: scale(1); }
        50%      { opacity: 1;    transform: scale(1.4); }
      }

      /* Respect the user's reduced-motion preference */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }

      /* First-run "empty" state before any search */
      .empty-hint {
        color: var(--ink-muted);
        font-size: 14px;
        margin-top: 8px;
      }

      /* Phone-specific tweaks — on top of the fluid clamps above */
      @media (max-width: 520px) {
        .card { padding: 18px 16px; }
        .trace-title { font-size: 12px; margin-bottom: 14px; }
        form.search { padding: 5px; }
        button { padding: 10px 16px; }
        ol.results li { padding: 14px 0; }
        .stage { padding: 12px 0; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div>
          <h1>Outdoors <em>semantic</em> search</h1>
          <p class="subtitle">
            5,331 community questions, retrieved by vector similarity and
            summarized by Claude Opus 4.7.
          </p>
        </div>
        <button
          class="theme-toggle"
          type="button"
          onclick="toggleTheme()"
          aria-label="Toggle theme"
        >
          <span id="theme-label">Dark</span>
        </button>
      </div>

      <form
        class="search-form"
        hx-post="/search"
        hx-target="#results"
        hx-swap="innerHTML"
      >
        <div class="search">
          <input
            type="search"
            name="query"
            placeholder="Ask anything about the outdoors…"
            required
            autofocus
          />
          <button type="submit">Search</button>
        </div>

        <details class="filters" {% if request.query_params.get('filters_open') %}open{% endif %}>
          <summary>Filters</summary>

          <div class="filter-group">
            <span class="filter-label">Show</span>
            <label class="toggle"><input type="checkbox" name="item_types" value="question" checked> Questions</label>
            <label class="toggle"><input type="checkbox" name="item_types" value="answer" checked> Answers</label>
            <label class="toggle"><input type="checkbox" name="accepted_only" value="1"> Only accepted answers</label>
          </div>

          {% if top_tags %}
          <div class="filter-group">
            <span class="filter-label">Tags</span>
            {% for t in top_tags %}
              <label class="tag-pill">
                <input type="checkbox" name="tags" value="{{ t }}">
                <span>{{ t }}</span>
              </label>
            {% endfor %}
          </div>
          {% endif %}
        </details>
      </form>

      <div id="results">
        <p class="empty-hint">
          Try "ideal footwear for hikes" or "how to purify water".
        </p>
      </div>
    </div>

    <script>
      // Theme toggle — persists in localStorage
      (function () {
        const saved = localStorage.getItem("theme") || "light";
        document.documentElement.dataset.theme = saved;
        document.getElementById("theme-label").textContent =
          saved === "dark" ? "Light" : "Dark";
      })();

      function toggleTheme() {
        const cur = document.documentElement.dataset.theme;
        const next = cur === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = next;
        localStorage.setItem("theme", next);
        document.getElementById("theme-label").textContent =
          next === "dark" ? "Light" : "Dark";
      }

      // Render "Behind the scenes" stage cards as SSE events arrive.
      // HTMX's SSE ext handles token events via sse-swap on the summary node;
      // we listen for 'stage' events here and render into #stages ourselves.
      const STAGE_LABELS = {
        embed: "Embedding query",
        search: "Hybrid retrieval (vector + BM25)",
        rerank: "Cross-encoder rerank",
        prompt: "Building prompt",
        llm: "Claude Opus 4.7",
      };

      function stageCard(name) {
        const el = document.createElement("div");
        el.className = "stage";
        el.dataset.stage = name;
        el.innerHTML = `
          <div class="dot"></div>
          <div class="body">
            <span class="label">${STAGE_LABELS[name] || name}</span>
            <span class="meta"></span>
          </div>
        `;
        return el;
      }

      function formatEmbed(s) {
        const preview = (s.preview || []).map((v) => v.toFixed(2)).join(", ");
        return `
          <span class="meta">${s.dim}-dim vector · ${s.ms} ms</span>
          <div class="sparkline">
            ${(s.preview || [])
              .map((v) => {
                const h = Math.max(2, Math.round(Math.abs(v) * 32));
                return `<span style="height:${h}px"></span>`;
              })
              .join("")}
          </div>
          <span class="meta">[${preview}, …]</span>
        `;
      }

      function formatSearch(s) {
        if (s.status === "active") return `<span class="meta">retrieving candidates…</span>`;
        const topLine = s.top_score != null
          ? `top RRF ${s.top_score.toFixed(3)}`
          : "no hits";
        return `
          <span class="meta">${s.k_retrieved} candidates · ${s.ms} ms · ${topLine}</span>
          <span class="meta">vector ${s.vector_hits} · BM25 ${s.keyword_hits} · overlap ${s.overlap}</span>
        `;
      }

      function formatRerank(s) {
        if (s.status === "active") {
          return `<span class="meta">scoring with ${s.model}…</span>`;
        }
        const header = `
          <span class="meta">${s.model}</span>
          <span class="meta">${s.candidates_in} -> ${s.candidates_out} · ${s.ms} ms</span>
          <span class="meta">${s.k_used} sent to Claude</span>
        `;
        const hits = s.hits || [];
        const max = hits.length ? hits[0].score : 1;
        const bars = hits
          .map((h, i) => {
            // rerank scores are logits, can be negative; normalize into [0, 1]
            // relative to top score for display width
            const width = Math.max(2, Math.round(Math.max(0, h.score / (max || 1)) * 100));
            const cls = i < s.k_used ? "hitbar top" : "hitbar";
            const safeTitle = h.title.replace(/"/g, "&quot;");
            return `<span class="${cls}" style="width:${width}%" title="${h.score.toFixed(3)} — ${safeTitle}"></span>`;
          })
          .join("");
        return header + `<div class="hitbars">${bars}</div>`;
      }

      function formatPrompt(s) {
        return `<span class="meta">${s.chars.toLocaleString()} chars · ~${s.approx_tokens.toLocaleString()} tokens</span>`;
      }

      function formatLLM(s) {
        if (s.status === "active") {
          return `<span class="meta">streaming from ${s.model}…</span>`;
        }
        return `
          <span class="meta">${s.model}</span>
          <span class="meta">${s.chunks} chunks · ${s.chars.toLocaleString()} chars</span>
          <span class="meta">TTFB ${s.ttfb_ms} ms · total ${s.total_ms} ms</span>
        `;
      }

      const FORMATTERS = {
        embed: formatEmbed,
        search: formatSearch,
        rerank: formatRerank,
        prompt: formatPrompt,
        llm: formatLLM,
      };

      document.body.addEventListener("htmx:sseMessage", (e) => {
        if (e.detail.type !== "stage") return;
        let payload;
        try {
          payload = JSON.parse(e.detail.data);
        } catch {
          return;
        }
        const stages = document.getElementById("stages");
        if (!stages) return;
        let card = stages.querySelector(`[data-stage="${payload.name}"]`);
        if (!card) {
          card = stageCard(payload.name);
          stages.appendChild(card);
        }
        card.dataset.status = payload.status;
        const bodyEl = card.querySelector(".body");
        const label = bodyEl.querySelector(".label").outerHTML;
        const fmt = FORMATTERS[payload.name];
        const content = fmt
          ? fmt(payload)
          : `<span class="meta">${payload.status}</span>`;
        bodyEl.innerHTML = label + content;
      });
    </script>
  </body>
</html>
