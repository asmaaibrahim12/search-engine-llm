<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Outdoors semantic search</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js"></script>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        max-width: 820px;
        margin: 2rem auto;
        padding: 0 1rem;
        color: #222;
      }
      h1 { margin-bottom: 0.25rem; }
      .subtitle { color: #666; margin-top: 0; }
      form { display: flex; gap: 0.5rem; margin: 1.5rem 0; }
      input[type="search"] {
        flex: 1; padding: 0.6rem 0.8rem;
        border: 1px solid #bbb; border-radius: 6px;
        font-size: 1rem;
      }
      button {
        padding: 0.6rem 1.2rem;
        border: 0; border-radius: 6px;
        background: #2a5; color: white;
        font-size: 1rem; cursor: pointer;
      }
      button:hover { background: #184; }
      .summary {
        border: 1px solid #333;
        padding: 1rem; margin: 1rem 0;
        background: #f8f9fc;
        color: #339;
        min-height: 2rem;
        white-space: pre-wrap;
      }
      .summary:empty::before {
        content: "Summary will stream here after you search.";
        color: #888;
      }
      ol.results li { margin: 0.75rem 0; }
      .score { color: #999; font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <h1>Outdoors semantic search</h1>
    <p class="subtitle">
      Semantic search over the outdoors Q&amp;A dataset, with a cited summary
      generated by Claude Opus 4.7.
    </p>

    <form hx-post="/search" hx-target="#results" hx-swap="innerHTML">
      <input
        type="search"
        name="query"
        placeholder="e.g. ideal footwear for hikes"
        required
        autofocus
      />
      <button type="submit">Search</button>
    </form>

    <div id="results"></div>
  </body>
</html>
